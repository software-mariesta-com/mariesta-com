<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>

		<meta name="text-scale" content="scale" />
		<link
			rel="preload"
			href="/fonts/Quizles-Decorative.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#F62440" />
		<script>
			try {
				var themeKey = 'mariesta-theme';
				var consentRaw = localStorage.getItem('mariesta-cookie-consent');
				var allowTheme = false;
				if (consentRaw) {
					try {
						var consent = JSON.parse(consentRaw);
						allowTheme = consent && consent.version === 1 && consent.preferences === true;
					} catch (e) {}
				}
				var stored = allowTheme ? localStorage.getItem(themeKey) : null;
				var preference =
					stored === 'winter' || stored === 'night' || stored === 'system' ? stored : 'system';
				var effective =
					preference === 'system'
						? window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'night'
							: 'winter'
						: preference;
				document.documentElement.setAttribute('data-theme', effective);
				document.documentElement.setAttribute('data-theme-preference', preference);
				var fav = document.createElement('link');
				fav.rel = 'icon';
				fav.type = 'image/svg+xml';
				fav.setAttribute('data-mariesta-favicon', 'true');
				fav.href = effective === 'night' ? '/favicon-night.svg' : '/favicon-light.svg';
				document.head.appendChild(fav);
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover"><div style="display: contents">%sveltekit.body%</div></body>
</html>
